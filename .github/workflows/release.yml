name: release

# Push a tag like v0.2.0 to build the binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # fully static, no glibc dependency — online + local-server brains and rules; no
          # in-process GGUF runtime (llama.cpp needs a C++ compiler musl-tools lacks)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: --no-default-features --features "remote service"
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (no model bytes; see the matrix for what each target can think with)
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Package
        run: |
          name="evolua-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/evolua" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
